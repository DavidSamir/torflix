name: Release APK

# Builds the sideload APK and attaches it to a GitHub Release.
#
# Trigger it by pushing a tag:   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab ("Run workflow"), which builds without creating a release.
#
# The published asset name is stable, so a Fire TV Downloader URL never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/torfilx-release.apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon

      # Signing: uses a real keystore when the repository secrets are present, and otherwise falls
      # back to the debug key. A debug-signed APK sideloads onto a Fire TV perfectly well — it only
      # matters that every build is signed with the *same* key, or the device refuses to upgrade
      # in place.
      - name: Decode keystore
        if: ${{ secrets.TORFILX_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.TORFILX_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          TORFILX_KEYSTORE: ${{ secrets.TORFILX_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          TORFILX_KEYSTORE_PASSWORD: ${{ secrets.TORFILX_KEYSTORE_PASSWORD }}
          TORFILX_KEY_ALIAS: ${{ secrets.TORFILX_KEY_ALIAS }}
          TORFILX_KEY_PASSWORD: ${{ secrets.TORFILX_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage the APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/torfilx-release.apk
          sha256sum dist/torfilx-release.apk | tee dist/torfilx-release.apk.sha256
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torfilx-release-apk
          path: |
            dist/torfilx-release.apk
            dist/torfilx-release.apk.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/torfilx-release.apk
            dist/torfilx-release.apk.sha256
          generate_release_notes: true
          body: |
            **Sideload onto a Fire TV**

            In the Downloader app, enter:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/torfilx-release.apk
            ```

            or from a PC on the same network:

            ```
            adb connect <fire-tv-ip>:5555
            adb install -r torfilx-release.apk
            ```

            Requires Fire OS 6 or later (Android 6.0 / API 23). Signed with v1 + v2 schemes.
