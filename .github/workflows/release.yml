name: Release APK

# Builds the sideload APK and attaches it to a GitHub Release.
#
# Trigger it by pushing a tag:   git tag v0.1.0 && git push origin v0.1.0
# or from the Actions tab ("Run workflow"), which builds without creating a release.
#
# The published asset name is stable, so a Fire TV Downloader URL never changes:
#   https://github.com/<owner>/<repo>/releases/latest/download/torfilx-release.apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are mapped to env here because the `secrets` context is not available in a step-level
    # `if:` — referencing it there makes GitHub reject the whole workflow before any job starts.
    env:
      KEYSTORE_B64: ${{ secrets.TORFILX_KEYSTORE_BASE64 }}
      TORFILX_KEYSTORE_PASSWORD: ${{ secrets.TORFILX_KEYSTORE_PASSWORD }}
      TORFILX_KEY_ALIAS: ${{ secrets.TORFILX_KEY_ALIAS }}
      TORFILX_KEY_PASSWORD: ${{ secrets.TORFILX_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The runner image does not ship the newest platform, and the build compiles against 37.
      # Note the id: platform 37 is published as the minor-versioned "android-37.0", so plain
      # "android-37" does not exist and sdkmanager fails with "Failed to find package".
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" ||
            sdkmanager --install "platforms;android-37" "build-tools;36.0.0" "platform-tools"
          ls "$ANDROID_HOME/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace

      # Signing: a real keystore is used when the repository secrets are present, otherwise the
      # debug key. A debug-signed APK sideloads onto a Fire TV fine — what matters is that every
      # build uses the *same* key, or the device refuses to upgrade in place.
      - name: Decode keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TORFILX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Stage the APK under a stable name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/torfilx-release.apk
          sha256sum dist/torfilx-release.apk | tee dist/torfilx-release.apk.sha256
          ls -lh dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: torfilx-release-apk
          path: |
            dist/torfilx-release.apk
            dist/torfilx-release.apk.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/torfilx-release.apk
            dist/torfilx-release.apk.sha256
          generate_release_notes: true
          body: |
            **Sideload onto a Fire TV**

            In the Downloader app, enter:

            ```
            https://github.com/${{ github.repository }}/releases/latest/download/torfilx-release.apk
            ```

            or from a PC on the same network:

            ```
            adb connect <fire-tv-ip>:5555
            adb install -r torfilx-release.apk
            ```

            Requires Fire OS 6 or later (Android 6.0 / API 23). Signed with v1 + v2 schemes.
